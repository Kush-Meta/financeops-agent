[project]
name = "financeops-agent"
version = "0.1.0"
description = "AI-powered finance operations agent for investigation, reconciliation, and variance analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.2",
    "openai>=3.8.0",
    "orjson>=3.12.0",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
financeops-seed = "app.scripts.seed:main"
financeops-eval = "eval.run_eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
