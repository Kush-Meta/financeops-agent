services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: sqlite:////data/financeops.db
      CORS_ORIGINS: http://localhost:3847,http://127.0.0.1:3847
      LLM_ENABLED: "false"
    volumes:
      - financeops-data:/data
      - ./backend/data/documents:/app/data/documents

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3847:3847"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8765/api
    depends_on:
      - api

volumes:
  financeops-data:
