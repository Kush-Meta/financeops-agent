services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: financeops
      POSTGRES_PASSWORD: financeops
      POSTGRES_DB: financeops
    ports:
      - "5433:5432"
    volumes:
      - financeops-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeops -d financeops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: postgresql+psycopg://financeops:financeops@db:5432/financeops
      CORS_ORIGINS: http://localhost:3847,http://127.0.0.1:3847
      LLM_ENABLED: "false"
      AUTH_ENABLED: "false"
      MAKER_CHECKER_ENABLED: "true"
    volumes:
      - ./backend/data/documents:/app/data/documents
      - ./backend/data/real:/app/data/real
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3847:3847"
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8765/api
    depends_on:
      - api

volumes:
  financeops-pg:
