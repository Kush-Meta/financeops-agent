name: financeops-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check app tests eval
      - name: Unit + workflow tests
        run: uv run pytest -q
      - name: Eval gates
        run: |
          uv run python -m eval.run_eval
          uv run python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/eval_report.json").read_text())
          recon = report["reconciliation"]
          agent = report["agent"]
          assert recon["precision"] >= 0.85, recon
          assert recon["recall"] >= 0.80, recon
          assert recon["calculation_accuracy"] is True, recon
          assert agent["tool_selection_accuracy"] >= 0.9, agent
          assert agent["task_completion_rate"] >= 0.9, agent
          assert agent["avg_unsupported_claim_rate"] <= 0.15, agent
          print("eval gates passed", {k: recon[k] for k in ("precision","recall")}, agent["tool_selection_accuracy"])
          PY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
